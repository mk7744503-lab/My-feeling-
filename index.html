
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#100910">
<title>The Art of Loving You — By Ali</title>
<style>
:root{--bg:#100910;--pink:#f2b6cc;--gold:#d8b77b;--cream:#fff5f4;--muted:#c4aebc}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% 0%,#48243b 0%,transparent 55%),linear-gradient(145deg,#100910,#170d1a 60%,#09070b);color:var(--cream);font-family:Georgia,serif;min-height:100vh}
button{font:inherit}
#app{max-width:850px;margin:auto;padding:22px 20px 55px}
header{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font:10px Arial;letter-spacing:3px}
header span:first-child{color:var(--pink)}
.progress{height:2px;background:#ffffff20;margin:25px 0 40px}
#bar{height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--gold));transition:width .7s}
.screen{min-height:68vh;display:flex;flex-direction:column;justify-content:center;animation:in .7s ease}
@keyframes in{from{opacity:0;transform:translateY(17px)}to{opacity:1;transform:none}}
.eyebrow{font:10px Arial;letter-spacing:4px;color:var(--gold);margin-bottom:23px}
h1{font-size:clamp(45px,9vw,82px);font-weight:normal;line-height:1.02;margin:0 0 25px}
h2{font-size:clamp(35px,7vw,62px);font-weight:normal;line-height:1.08;margin:0 0 28px}
p{font-size:clamp(17px,3vw,20px);line-height:1.9;color:#eadde5;margin:0 0 18px}
.pink{color:var(--pink);font-style:italic}
.gold{color:var(--gold)}
.quote{border-left:1px solid var(--gold);padding:8px 0 8px 20px;color:var(--pink);font-size:20px;font-style:italic;line-height:1.7;margin:26px 0}
.panel{background:linear-gradient(145deg,#ffffff10,#ffffff04);border:1px solid #ffffff24;border-radius:18px;padding:24px;margin:24px 0}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.btn{border:1px solid #eab7ca;background:linear-gradient(110deg,#efb3ca,#d6b77d);color:#281622;border-radius:40px;padding:15px 22px;font:bold 11px Arial;letter-spacing:2px;cursor:pointer;transition:.25s}
.btn:hover{transform:translateY(-3px);box-shadow:0 8px 25px #e9a9c544}
.btn.secondary{background:transparent;color:var(--cream);border-color:#ffffff40}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:#ffffff08;color:var(--cream);border:1px solid #ffffff25;border-radius:12px;padding:16px;text-align:left;cursor:pointer;line-height:1.5}
.tile:hover{border-color:var(--pink)}
.tile small{display:block;color:var(--gold);font:10px Arial;letter-spacing:2px;margin-bottom:9px}
.tile em{display:block;color:var(--pink);font-size:15px;margin-top:9px}
.music{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #ffffff20;margin-top:32px;padding-top:17px;gap:10px;color:var(--muted);font:10px Arial;letter-spacing:1px}
.music button{background:none;border:1px solid #ffffff40;color:white;padding:9px 13px;border-radius:30px;cursor:pointer}
footer{text-align:center;color:#806d7d;font:9px Arial;letter-spacing:3px;margin-top:55px}
#finalButton{width:100%;padding:21px 12px;font-size:13px;letter-spacing:3px}
#status{font:12px Arial;color:var(--gold);margin-top:16px;line-height:1.7}
.hidden{display:none!important}
@media(max-width:520px){#app{padding:20px 16px}.grid{grid-template-columns:1fr}.panel{padding:19px}}
</style>
</head>
<body>
<div id="app">
<header><span>BY ALI</span><span>A STORY FOR ARESHEY</span></header>
<div class="progress"><div id="bar"></div></div>
<main id="content"></main>
<div class="music" id="music">
<span>THE SOUNDTRACK OF THIS JOURNEY</span>
<button id="musicBtn" onclick="toggleMusic()">♫ MUSIC OFF</button>
</div>
<footer>EVERY WORD HAS A FEELING BEHIND IT</footer>
</div>

<audio id="bg" src="assets/romantic.mp3" loop preload="auto"></audio>
<audio id="voice" src="assets/Areshey_Final_Reveal.mp3" preload="auto"></audio>

<script>
const chapters=[
{
name:"The Beautiful Danger",tag:"01 — THE BEGINNING",
lines:[
"Some people enter your life without making a sound. And somehow, they become the loudest thought in your heart.",
"I never planned to feel this way. I never sat down and decided that someone would become this special.",
"But somewhere between little conversations and moments I cannot explain, you became someone I wanted to know more deeply."
],quote:"You became a beautiful thought I never wanted to escape."
},
{
name:"Something About You",tag:"02 — THE LITTLE DETAILS",
lines:[
"It is difficult to explain what makes someone special when it is not just one thing.",
"It is your little details. The way you express yourself. The things you say without realizing how much they stay with me.",
"I notice things. Maybe more than I say. And every little detail adds another reason to admire you."
],quote:"I don't just notice you. I remember the little things."
},
{
name:"The Things I Hide",tag:"03 — BEHIND MY WORDS",
lines:[
"Sometimes I act normal even when my heart is saying a hundred different things.",
"Sometimes I hide a compliment inside a joke. Sometimes I change the subject because I have too much to say.",
"It was never because I had nothing to express. It was because some feelings deserve more than careless words."
],quote:"There are feelings behind my words that you may never have noticed."
},
{
name:"A Mind Full Of You",tag:"04 — THE THOUGHTS",
lines:[
"You appear in my thoughts at the most unexpected times.",
"A song, a quiet evening, a random smile — suddenly something reminds me of you.",
"And I find myself smiling at a thought that nobody else can see."
],quote:"You have become part of so many moments when you are not even there."
},
{
name:"The Way I Want You",tag:"05 — MY KIND OF LOVE",
lines:[
"I don't want to admire only the perfect moments. I want to appreciate the person behind them.",
"Your individuality, your opinions, your moods, your dreams. All the things that make you uniquely you.",
"I want my feelings to make you feel appreciated, never restricted. To feel free, never pressured."
],quote:"I want to care for you without asking you to become someone else."
},
{
name:"A Little Jealousy",tag:"06 — THE HONEST TRUTH",
lines:[
"Yes, sometimes I feel a little jealous. I won't pretend that I am made of stone.",
"When someone matters, the heart can become sensitive in ways we don't always expect.",
"But I know that caring about you does not give me ownership over you. Your freedom matters too."
],quote:"My feelings can be deep without becoming a cage around you."
},
{
name:"The Things I Imagine",tag:"07 — LITTLE DREAMS",
lines:[
"I imagine simple moments. A conversation that never feels boring. Laughing over something silly. Sharing a memory that stays with us.",
"Not some impossible fairytale. Just genuine moments with someone who has become important to me.",
"Sometimes the smallest dreams carry the biggest feelings."
],quote:"I don't need a perfect world. I imagine beautiful moments."
},
{
name:"No More Hiding",tag:"08 — THE COURAGE",
lines:[
"I have tried different ways to express myself. Through teasing, through compliments, through little hints.",
"But there comes a time when hints are no longer enough.",
"I want to be honest about what you mean to me. Not because I expect anything, but because my feelings deserve an honest voice."
],quote:"Today, I want to let my heart speak a little more openly."
},
{
name:"If You Could See My Heart",tag:"09 — WHAT WORDS CANNOT HOLD",
lines:[
"If you could see all the thoughts I have never managed to put into words, you might understand why this has been so difficult to explain.",
"It is admiration, tenderness, excitement, care and a thousand little emotions together.",
"I cannot promise perfect words. But I can promise that these feelings are sincere."
],quote:"My heart has been saying much more than my words ever could."
},
{
name:"Every Little Reason",tag:"10 — OPEN MY LITTLE SECRETS",
lines:[
"Maybe one reason could never explain it. So I made twenty little doors.",
"Open them one by one. Each one carries a small piece of what makes you special to me."
],quote:"Twenty little reasons. One very genuine feeling."
},
{
name:"Before You Hear Me",tag:"11 — THE MOMENT BEFORE",
lines:[
"We have travelled through words, thoughts and feelings. But there is something that written words cannot do.",
"You have read what I wanted to express. Now I want you to hear it in my own voice.",
"In a moment, the music will disappear. I want there to be nothing between you and the words I have been saving."
],quote:"The background will go quiet. My heart will finally have a voice."
},
{
name:"The Unfiltered Confession",tag:"12 — JUST ME, BEING HONEST",
lines:[
"Areshey, I don't know if any collection of words could fully explain what you mean to me.",
"You have become someone I genuinely admire. Someone whose presence, thoughts and little details have found a special place in my heart.",
"I have tried to express this in so many ways. Sometimes I was playful, sometimes shy, sometimes I said less than I wanted to.",
"But this time I don't want to hide behind hints. I want you to hear my actual voice. My singing. My confession. Everything I have been wanting to express.",
"I am not asking you to give me an answer because of this. I want your feelings to be yours, freely. I only want you to know mine."
],quote:"The words end here. My own voice begins."
}
];

const reasons=[
"Your smile has a way of staying in my mind.",
"I love discovering the little details about you.",
"Your way of expressing yourself is special.",
"You make ordinary conversations memorable.",
"I admire the person you are.",
"Your presence can change the mood of a moment.",
"I like the way your mind works.",
"You are never just another face in a crowd to me.",
"I find myself remembering little things you say.",
"I admire your individuality.",
"I want to understand your thoughts.",
"You inspire me to express myself better.",
"Even a simple hello can make me smile.",
"I appreciate the little things you may overlook.",
"I like that you are your own person.",
"You have a special place in my thoughts.",
"I want to see you happy.",
"I enjoy the feeling of knowing you.",
"I don't need you to be perfect to admire you.",
"Because there is something about you I cannot replace with words."
];
let page=-1,opened=new Set(),playing=false,voicePlaying=false;
const content=document.getElementById("content"),bg=document.getElementById("bg"),voice=document.getElementById("voice");
const bar=document.getElementById("bar"),music=document.getElementById("music");
function updateMusic(){document.getElementById("musicBtn").textContent=bg.paused?"♫ MUSIC OFF":"♫ MUSIC ON";}
function toggleMusic(){
 if(page<0||page>=10||voicePlaying)return;
 if(bg.paused){bg.volume=.36;bg.play().then(updateMusic).catch(updateMusic)}
 else{bg.pause();updateMusic()}
}
function enter(){
 page=0;render();bg.volume=.36;
 bg.play().then(updateMusic).catch(updateMusic);
}
function fadeOut(){
 return new Promise(resolve=>{
  if(bg.paused){bg.currentTime=0;resolve();return}
  let n=0,v=bg.volume;
  const t=setInterval(()=>{
   n++;bg.volume=Math.max(0,v*(1-n/35));
   if(n>=35){clearInterval(t);bg.pause();bg.currentTime=0;bg.volume=.36;updateMusic();resolve()}
  },100);
 });
}
async function next(){
 if(page===10){await fadeOut();page=11;render();return}
 if(page<11){page++;render()}
}
function back(){
 if(page>0){page--;if(page>=10){bg.pause();updateMusic()}render()}
}
function openReason(i){
 const el=document.getElementById("r"+i);
 if(opened.has(i)){opened.delete(i);el.innerHTML=`<small>SECRET ${String(i+1).padStart(2,"0")}</small>Tap to discover a reason <span class="gold">＋</span>`}
 else{opened.add(i);el.innerHTML=`<small>SECRET ${String(i+1).padStart(2,"0")}</small>${reasons[i]}<em>♡</em>`}
}
function revealLetter(){
 const el=document.getElementById("letter");
 el.classList.toggle("hidden");
}
function playVoice(){
 bg.pause();bg.currentTime=0;updateMusic();voicePlaying=true;
 const b=document.getElementById("finalButton"),s=document.getElementById("status");
 b.disabled=true;b.textContent="PLAYING MY HEART...";
 s.textContent="Listen to every word. ❤️";
 voice.play().then(()=>{
  voice.onended=()=>{
   b.disabled=false;b.textContent="LISTEN TO MY CONFESSION AGAIN";
   s.textContent="Every word came from my own heart.";
   voicePlaying=false;
  };
 }).catch(()=>{
  b.disabled=false;b.textContent="TAP TO PLAY MY CONFESSION";
  s.textContent="Audio could not load. Check assets/Areshey_Final_Reveal.mp3";
  voicePlaying=false;
 });
}
function render(){
 if(page<0){
  bar.style.width="0%";music.classList.add("hidden");
  content.innerHTML=`<section class="screen">
   <div class="eyebrow">A PERSONAL STORY — BY ALI</div>
   <h1>The Art of<br><span class="pink">Loving You.</span></h1>
   <p>Twelve chapters. Little secrets. Unspoken feelings. And a voice waiting at the end.</p>
   <div class="quote">"If I could put my heart into a story, this would be the beginning."</div>
   <div class="actions"><button class="btn" onclick="enter()">ENTER MY WORLD →</button></div>
   <p style="font-size:12px;color:#b69cab;margin-top:20px">A little journey made only for you. Best with headphones.</p>
  </section>`;return;
 }
 bar.style.width=((page+1)/12*100)+"%";
 music.classList.toggle("hidden",page>=10);
 const c=chapters[page];
 let extra="";
 if(page===9){
  extra=`<div class="panel"><div class="eyebrow">20 LITTLE REASONS</div><div class="grid">${reasons.map((r,i)=>`<button class="tile" id="r${i}" onclick="openReason(${i})"><small>SECRET ${String(i+1).padStart(2,"0")}</small>Tap to discover a reason <span class="gold">＋</span></button>`).join("")}</div></div>`;
 }
 if(page===10){
  extra=`<div class="panel"><div class="eyebrow">A LITTLE SOMETHING I SAVED</div><button class="btn secondary" onclick="revealLetter()">OPEN MY LAST LETTER ♡</button><div id="letter" class="hidden"><p class="pink" style="margin-top:22px">I hope that as you read this, you feel appreciated, respected and genuinely special. I have not made this to ask for an answer. I made it because I wanted to express something beautiful, honestly.</p></div></div>`;
 }
 if(page===11){
  extra=`<div class="panel">
   <div class="eyebrow">THE MOMENT I HAVE BEEN SAVING</div>
   <h2 class="pink">No more hints.<br>Hear my heart.</h2>
   <p>My singing. My spoken confession. My own voice — brought together for you.</p>
   <button class="btn" id="finalButton" onclick="playVoice()">PLAY MY CONFESSION ♥</button>
   <div id="status">Take your time. This moment is yours to experience.</div>
  </div>`;
 }
 content.innerHTML=`<section class="screen">
  <div class="eyebrow">${c.tag}</div>
  <h2>${c.name}</h2>
  ${c.lines.map(x=>`<p>${x}</p>`).join("")}
  <div class="quote">“${c.quote}”</div>
  ${extra}
  <div class="actions">
   ${page>0?'<button class="btn secondary" onclick="back()">← BACK</button>':''}
   ${page<11?'<button class="btn" onclick="next()">CONTINUE →</button>':''}
  </div>
 </section>`;
}
render();
</script>
</body>
</html>
